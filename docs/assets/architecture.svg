<g><rect x="76" y="160" width="368" height="160" fill="#0b0f14" stroke="#79a8ff" stroke-width="1"/><text x="260" y="200" text-anchor="middle" class="title">LOCAL PROJECT</text><text x="260" y="232" text-anchor="middle" class="sub" fill="#79a8ff">Mac 本地项目</text><text x="260" y="272" text-anchor="middle" class="detail">Source of truth · local files</text><text x="260" y="296" text-anchor="middle" class="detail">Only explicitly selected context</text></g>
<g><rect x="616" y="160" width="368" height="160" fill="#0b0f14" stroke="#79a8ff" stroke-width="1"/><text x="800" y="200" text-anchor="middle" class="title">LOCAL CONTROLLER</text><text x="800" y="232" text-anchor="middle" class="sub" fill="#79a8ff">Codex / 已有 Claudex</text><text x="800" y="272" text-anchor="middle" class="detail">Read scope · preserve local edits</text><text x="800" y="296" text-anchor="middle" class="detail">$grok-cc  /  /grok-cc</text></g>
<g><rect x="1156" y="160" width="368" height="160" fill="#0b0f14" stroke="#79a8ff" stroke-width="1"/><text x="1340" y="200" text-anchor="middle" class="title">TASK PACKET</text><text x="1340" y="232" text-anchor="middle" class="sub" fill="#79a8ff">任务快照与基线</text><text x="1340" y="272" text-anchor="middle" class="detail">File allowlist · SHA256</text><text x="1340" y="296" text-anchor="middle" class="detail">No credentials / native state</text></g>
