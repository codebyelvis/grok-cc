<text x="60" y="65" class="label">GUARDED HANDOFF · EXPLICIT CONTEXT · LOCAL ACCEPTANCE</text>
<rect x="1338" y="10" width="214" height="28" fill="#0b0f14"/>
<text x="1540" y="30" text-anchor="end" class="label">STATIC FLOW / 静态示意</text>
<line x1="60" y1="103" x2="88" y2="103" stroke="#79a8ff"/><text x="98" y="107" fill="#79a8ff" font-size="12">LOCAL / 本地</text>
