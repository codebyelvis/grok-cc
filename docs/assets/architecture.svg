<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="flow-title flow-desc">
<!-- Author: elvis. Static workflow; no runtime health is implied. -->
<title id="flow-title">grok-cc / Local Mac to cloud Claude Code and back</title>
<desc id="flow-desc">Mac source and controller prepare an explicit packet, use one bound cloud Claude Code through Orca, recover a complete patch, and validate, review, apply and test it locally. Missing output stops admission. Bindings persist between tasks. This is a static workflow, not live health.</desc>
<defs>
<style>text{font-family:'JetBrains Mono','SF Mono',Menlo,monospace} .title{fill:#f0f6fc;font-size:20px;font-weight:700} .sub{font-size:18px} .detail{fill:#7d8590;font-size:13px} .label{fill:#7d8590;font-size:11px} .heading{fill:#f0f6fc;font-size:21px;font-weight:700}</style>
