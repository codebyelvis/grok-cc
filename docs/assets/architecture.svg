<g><rect x="616" y="464" width="368" height="160" fill="#0b0f14" stroke="#5ad1e6" stroke-width="1"/><text x="800" y="504" text-anchor="middle" class="title">ORCA TRANSPORT</text><text x="800" y="536" text-anchor="middle" class="sub" fill="#5ad1e6">原生派发与回执</text><text x="800" y="576" text-anchor="middle" class="detail">Same task / message → same receipt</text><text x="800" y="600" text-anchor="middle" class="detail">Busy / offline → retain binding</text></g>
<g><rect x="1156" y="464" width="368" height="160" fill="#0b0f14" stroke="#6fdc8c" stroke-width="1"/><text x="1340" y="504" text-anchor="middle" class="title">REMOTE CLAUDE CODE</text><text x="1340" y="536" text-anchor="middle" class="sub" fill="#6fdc8c">Grok Bot 云端执行</text><text x="1340" y="576" text-anchor="middle" class="detail">Auto mode · supplied snapshot only</text><text x="1340" y="600" text-anchor="middle" class="detail">Cloud cwd ≠ Mac project</text></g>
<g><rect x="76" y="768" width="368" height="160" fill="#0b0f14" stroke="#6fdc8c" stroke-width="1"/><text x="260" y="808" text-anchor="middle" class="title">COMPLETE PATCH</text><text x="260" y="840" text-anchor="middle" class="sub" fill="#6fdc8c">当前任务的完整产物</text><text x="260" y="880" text-anchor="middle" class="detail">BEGIN_PATCH … END_PATCH</text><text x="260" y="904" text-anchor="middle" class="detail">Missing / clipped → stop admission</text></g>
<g><rect x="616" y="768" width="368" height="160" fill="#0b0f14" stroke="#b48cff" stroke-width="1"/><text x="800" y="808" text-anchor="middle" class="title">LOCAL PATCH CHECK</text><text x="800" y="840" text-anchor="middle" class="sub" fill="#b48cff">Mac 本地准入校验</text><text x="800" y="880" text-anchor="middle" class="detail">Allowlist · baseline · path / symlink</text><text x="800" y="904" text-anchor="middle" class="detail">git apply --check · no source writes</text></g>
<g><rect x="1156" y="768" width="368" height="160" fill="#0b0f14" stroke="#b48cff" stroke-width="1"/><text x="1340" y="808" text-anchor="middle" class="title">VERIFY &amp; REVIEW</text><text x="1340" y="840" text-anchor="middle" class="sub" fill="#b48cff">审查 · 应用 · 测试 · 独立审核</text><text x="1340" y="880" text-anchor="middle" class="detail">Keep binding for the next task</text><text x="1340" y="904" text-anchor="middle" class="detail">finish ≠ project PASS</text></g>
